services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      SQLITE_PATH: /data/database.sqlite
      CORS_ORIGINS: http://localhost:8080
      SOCKET_CORS_ORIGINS: http://localhost:8080
    volumes:
      - bunker_sqlite_data:/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  bunker_sqlite_data:
